<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>second-brain 采集设置</title>
    <style>
      body { font-family: system-ui, sans-serif; max-width: 560px; margin: 24px auto; padding: 0 16px; color: #222; }
      h2 { margin-bottom: 4px; } h3 { margin: 20px 0 6px; }
      label { display: block; margin: 12px 0 4px; font-weight: 600; }
      input[type="text"], input[type="password"], input[type="number"], textarea { width: 100%; padding: 6px 8px; box-sizing: border-box; }
      input[type="number"].short { width: 90px; }
      button { padding: 6px 14px; margin: 8px 8px 0 0; cursor: pointer; }
      .row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
      .row label { margin: 0; }
      #status { margin-top: 10px; padding: 8px 10px; border-radius: 6px; display: none; }
      #status.ok { display: block; background: #e8f6ef; color: #1e7d4f; }
      #status.warn { display: block; background: #fdf3e0; color: #9a6b00; }
      #status.err { display: block; background: #fdecea; color: #b3261e; }
      small { color: #666; }
      pre#diag { font-size: 11px; background: #f6f6f6; padding: 8px 10px; border-radius: 6px; white-space: pre-wrap; word-break: break-all; max-height: 220px; overflow: auto; }
    </style>
  </head>
  <body>
    <h2>second-brain 采集设置</h2>
    <label for="serverUrl">服务器地址</label>
    <input id="serverUrl" type="text" placeholder="https://your-domain.example 或 http://localhost:8000" />
    <label for="token">采集凭据（服务器 Web 界面「采集凭据」生成，只显示一次）</label>
    <input id="token" type="password" placeholder="sb_cap_…" />
    <div class="row"><button id="save">保存</button><button id="test">保存并测试</button></div>
    <div id="status"></div>

    <h3>采集触发阈值</h3>
    <div class="row">
      <label for="minSeconds">停留（秒）</label><input id="minSeconds" type="number" min="1" class="short" />
      <label for="scrollRatio">滚动深度（0–1）</label><input id="scrollRatio" type="number" min="0.05" max="1" step="0.05" class="short" />
    </div>

    <h3>快照</h3>
    <div class="row">
      <label for="snapshotMaxMb">单页上限（MB）</label><input id="snapshotMaxMb" type="number" min="1" max="100" class="short" />
      <label><input id="metadataOnly" type="checkbox" /> 正文提取失败时保留标题/网址条目</label>
    </div>

    <h3>黑名单（域名，一行一个；含子域；源头不采集）</h3>
    <textarea id="blocklist" rows="6" placeholder="例如：&#10;mail.example.com&#10;internet-banking.example.org"></textarea>

    <p><small>保存时会请求该服务器域名的访问权限（MV3 要求）。暂停采集在扩展图标弹窗中一键切换；阈值与黑名单改动对新打开的页面生效。</small></p>

    <h3>诊断（排障用）</h3>
    <pre id="diag">加载中…</pre>
    <button id="diag-refresh">刷新诊断</button>
    <script type="module" src="./options.js"></script>
  </body>
</html>
