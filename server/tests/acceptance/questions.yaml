# SC-002 样例题集（T040，2026-10-02）
#
# 分类：
#   hit      —— 命中类：期望 source_type=kb，且 citations 指向 expected_document
#   fallback —— 兜底类：期望 source_type≠kb（首轮 model_knowledge；重复评测时 prior_conversation 亦算通过）
#   recall   —— 对 recall_of 指定题的"抬二次"，期望 source_type=prior_conversation
