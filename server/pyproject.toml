[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "second-brain-server"
version = "0.1.0"
description = "second-brain 后端（F1 核心问答）"
requires-python = ">=3.12"
dependencies = [
  "fastapi",
  "uvicorn[standard]",
  "pydantic-settings",
  "python-multipart",
  "sqlalchemy[asyncio]",
  "asyncpg",
  "alembic",
  "pgvector",
  "argon2-cffi",
  "itsdangerous",
  "httpx",
  "docling",
  "transformers",
  "mcp",
  "trafilatura>=2.3.0",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "ruff", "jieba"]  # jieba 供检索评测工具（tests/acceptance/retrieval_eval.py）

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint.flake8-bugbear]
# FastAPI 依赖注入惯例：Depends/File 出现在默认参数中
extend-immutable-calls = ["fastapi.Depends", "fastapi.File"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
markers = [
    "acceptance: 端到端验收（需运行中的服务；`pytest -m acceptance` 仅跑验收，`-m 'not acceptance'` 跳过）",
]
