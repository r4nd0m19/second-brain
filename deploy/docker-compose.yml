# 生产部署时扩展 app 服务（T035）；当前用于本地/服务器数据库
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: secondbrain
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请在 deploy/.env 设置 POSTGRES_PASSWORD（无默认值，T093 防弱口令部署）}
      POSTGRES_DB: secondbrain
    ports:
      # 仅绑定 127.0.0.1（数据库不对公网；本机 WSL 已有系统 Postgres 占 5432，故映射 5433）
      - "127.0.0.1:5433:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U secondbrain -d secondbrain"]
      interval: 5s
      timeout: 3s
      retries: 10

  # 免费自托管元搜索（T085/R39）：联网检索的零成本首选源（SearXNG 聚合多引擎；JSON 接口已开）
  searxng:
    image: searxng/searxng:latest
    volumes:
      - ./searxng:/etc/searxng:rw
    ports:
      # 仅绑定 127.0.0.1（无鉴权，不对公网/局域网暴露）；后端经 http://127.0.0.1:8888 调用
      - "127.0.0.1:8888:8080"
    environment:
      - SEARXNG_BASE_URL=http://localhost:8888/
      # 仅本机服务；值需在 deploy/.env 提供（T093 防默认密钥部署）
      - SEARXNG_SECRET=${SEARXNG_SECRET:?请在 deploy/.env 设置 SEARXNG_SECRET（可 openssl rand -hex 32）}
    restart: unless-stopped

volumes:
  db_data:
